name: Build blog

# Runs whenever a blog post or photo is saved (from the blog editor or from GitHub).
# Turns _blog/posts into the web pages under /blog/, the "From Our Kitchen" cards on the homepage and the sitemap,
# then saves the result back to the site.
on:
  push:
    branches: [main]
    paths:
      - "_blog/**"
      - "_tools/**"
      - ".pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _tools/package-lock.json

      - name: Install
        run: npm ci
        working-directory: _tools

      - name: Build the blog
        run: node build-blog.mjs
        working-directory: _tools

      - name: Save the rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git commit -m "Rebuild blog pages"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
